<!DOCTYPE html>
<html>
  <head>
    <title>Delta Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta charset="UTF-8" />
  </head>
  <body class="bg-zinc-50 text-zinc-900 min-h-screen flex flex-col items-center justify-center gap-6 font-mono">

    <div class="flex flex-col items-center gap-1">
      <h1 class="text-zinc-900 text-xl font-bold tracking-widest uppercase">delta</h1>
      <p id="machine-name" class="text-zinc-400 text-sm">connecting...</p>
    </div>

    <div id="graph" class="bg-white rounded-2xl p-6 shadow-sm border border-zinc-200">
      <p class="text-zinc-300 text-sm">waiting for graph...</p>
    </div>

    <div class="flex flex-col items-center gap-2">
      <div id="input-display" class="flex gap-2 text-lg tracking-widest"></div>

      <div class="flex items-center gap-4 text-sm text-zinc-400">
        <span>step <span id="step-current" class="text-zinc-900 font-bold">-</span> / <span id="step-total">-</span></span>
        <span>·</span>
        <span>active: <span id="active-states" class="text-rose-500 font-bold">-</span></span>
      </div>

      <div id="verdict" class="text-sm font-bold mt-1"></div>
    </div>

    <p class="text-zinc-300 text-xs">← → to step &nbsp;·&nbsp; space to advance &nbsp;·&nbsp; q to quit</p>

    <script>
      const ws = new WebSocket("ws://localhost:4000/ws");

      ws.onmessage = (event) => {
        const { svg, step, total, activeStates, accepted, input, machineName } = JSON.parse(event.data);

        // graph
        const graph = document.getElementById("graph");
        graph.innerHTML = svg;
        const svgEl = graph.querySelector("svg");
        if (svgEl) {
          svgEl.style.maxWidth = "80vw";
          svgEl.style.maxHeight = "60vh";
        }

        // machine name
        document.getElementById("machine-name").textContent = machineName ?? "";

        // input display
        const inputDisplay = document.getElementById("input-display");
        inputDisplay.innerHTML = "";
        if (input) {
          [...input].forEach((symbol, i) => {
            const isLast = step === total - 1;
            const isActive = !isLast && i === step;
            const isPast = isLast || i < step;
            const span = document.createElement("span");
            span.textContent = symbol;
            span.className = isActive
            ? "text-rose-500 font-bold underline underline-offset-4"
            : isPast
            ? "text-zinc-300 line-through"
            : "text-zinc-600";
            inputDisplay.appendChild(span);
          });
        }

        // step
        document.getElementById("step-current").textContent = step;
        document.getElementById("step-total").textContent = total - 1;

        // active states
        document.getElementById("active-states").textContent =
          `{${activeStates.join(", ")}}`;

        // verdict
        const verdict = document.getElementById("verdict");
        if (accepted === null) {
          verdict.textContent = "";
        } else if (accepted) {
          verdict.textContent = "✓ accepted";
          verdict.className = "text-green-500 font-bold mt-1";
        } else {
          verdict.textContent = "✗ rejected";
          verdict.className = "text-red-500 font-bold mt-1";
        }
      };

      ws.onclose = () => {
        document.getElementById("machine-name").textContent = "disconnected";
      };
    </script>
  </body>
</html>
